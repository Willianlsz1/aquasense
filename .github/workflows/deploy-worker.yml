# ── Deploy automático do Cloudflare Worker ────────────────────────────────────
# Publica o Worker (e aplica a migração do D1) a cada push na main que toque a
# pasta cloudflare-worker/ — pensado para quem trabalha só pelo navegador, sem
# terminal. Também pode ser disparado à mão na aba Actions ("Run workflow").
#
# Pré-requisito (uma vez só): criar o secret CLOUDFLARE_API_TOKEN no GitHub
# (Settings → Secrets and variables → Actions) com um token da Cloudflare
# criado a partir do template "Edit Cloudflare Workers" + permissão
# Account → D1 → Edit. O ACCOUNT_ID abaixo não é segredo (aparece na URL do
# painel da Cloudflare).

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 8bd6e3dd5c9087ee858f1b615d01ff98
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite nos testes de retenção

      - name: Testes
        working-directory: .
        run: npm test

      # Inspeciona o schema antes do ALTER; erro de consulta interrompe o job.
      # Não tratar falhas de autenticação/rede/SQL como migração já aplicada.
      - name: Migração D1 0001 (recebido_em, idempotente)
        shell: bash
        run: |
          set -euo pipefail
          schema=$(mktemp)
          trap 'rm -f "$schema"' EXIT
          npx wrangler@4 d1 execute piezometro-db --remote --json \
            --command "PRAGMA table_info(leituras);" > "$schema"
          jq -e 'type == "array" and length > 0 and all(.[]; .success == true and (.results | type == "array"))' "$schema" > /dev/null
          if ! jq -e 'any(.[].results[]; .name == "recebido_em")' "$schema" > /dev/null; then
            npx wrangler@4 d1 execute piezometro-db --remote \
              --command "ALTER TABLE leituras ADD COLUMN recebido_em INTEGER;"
          fi

      - name: Migração D1 0002 (dedupe + índice único, idempotente)
        run: >
          npx wrangler@4 d1 execute piezometro-db --remote
          --file=migrations/0002_dedupe_ts_unico.sql

      # CREATE TABLE IF NOT EXISTS já permite reexecução sem mascarar erros.
      - name: Migração D1 0003 (tabela leituras_diario, idempotente)
        run: >
          npx wrangler@4 d1 execute piezometro-db --remote
          --file=migrations/0003_retencao_diaria.sql

      - name: Migração D1 0004 (índices de estado atual)
        run: >
          npx wrangler@4 d1 execute piezometro-db --remote
          --file=migrations/0004_indices_estado.sql

      - name: Publicar Worker
        run: npx wrangler@4 deploy
